document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-6f4b-4a47-bd21-e54a3718390a\"><\u002Fscript>\n<style>\nbody{margin:0;background:var(--ice-blue);font-family:var(--font-body,\"Titillium Web\",system-ui,sans-serif)}\na{color:var(--sapphire);text-decoration:none}a:hover{color:var(--sapphire-hover)}\n*{box-sizing:border-box}\n::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#A6C5D7;border-radius:8px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;height:100vh;overflow:hidden;position:relative;color:#101B3A;font-family:'Titillium Web',system-ui,sans-serif\">\n\n  <aside style=\"width:236px;flex:none;background:#101B3A;color:#EFEDDA;display:flex;flex-direction:column;padding:20px 0\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:0 20px 22px;border-bottom:1px solid #2C3A5E\">\n      <img src=\"87f819ca-baae-464b-be88-bbda2d2fc3cc\" alt=\"FootNova\" style=\"width:34px;height:34px;object-fit:contain\">\n      <div style=\"display:flex;flex-direction:column;gap:1px\">\n        <span style=\"font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:16px;letter-spacing:-0.02em\">FootNova<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:#A6C5D7\">RECRUITING<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex;flex-direction:column;gap:2px;padding:16px 12px\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ n.go }}\" style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;background:{{ n.bg }};color:{{ n.color }}\">\n          <span style=\"width:16px;text-align:center;font-size:14px\">{{ n.icon }}<\u002Fspan>\n          <span style=\"flex:1\">{{ n.label }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.7\">{{ n.count }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"margin-top:auto;padding:16px 20px;border-top:1px solid #2C3A5E;display:flex;align-items:center;gap:10px\">\n      <div style=\"width:32px;height:32px;border-radius:50%;background:#0F52BA;color:#EFEDDA;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px\">HK<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <span style=\"font-size:13px;font-weight:600\">Hazem K.<\u002Fspan>\n        <span style=\"font-size:11px;color:#A6C5D7\">Talent Lead<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1;min-width:0;display:flex;flex-direction:column;background:var(--ice-blue)\">\n    <header style=\"height:64px;flex:none;background:#FFFFFF;border-bottom:1px solid #A6C5D7;display:flex;align-items:center;gap:16px;padding:0 24px\">\n      <div style=\"flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:#EFEDDA;border:1px solid #A6C5D7;border-radius:6px;padding:8px 12px\">\n        <span style=\"color:#2C3A5E;font-size:13px\">⌕<\u002Fspan>\n        <input value=\"{{ search }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"Search jobs or candidates\" style=\"flex:1;border:none;outline:none;background:transparent;font-family:'Titillium Web',system-ui,sans-serif;font-size:14px;color:#101B3A\">\n      <\u002Fdiv>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:12px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#2C3A5E;letter-spacing:0.06em\">{{ candTotalLabel }}<\u002Fspan>\n        <x-import component-from-global-scope=\"FootNovaDesignSystem_0fe511.Button\" size=\"sm\" sc-camel-on-click=\"{{ openJobModal }}\" hint-size=\"150px,36px\">＋ Post New Job<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"flex:1;overflow:auto;padding:24px 28px 40px;min-width:0\">\n\n      <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n neutral',Screening:'sapphire',Interview:'warning',Offer:'success',Hired:'success',Rejected:'danger'};\nconst SEGC = {Applied:'#A6C5D7',Screening:'#0F52BA',Interview:'#D6A13A',Offer:'#2E8B67',Hired:'#101B3A',Rejected:'#C1443D'};\nconst AVA = ['#0F52BA','#101B3A','#2C3A5E','#2E8B67','#C1443D','#0D46A0'];\nlet uid = 100;\nconst c = (name, email, date, stage, rating, short) => ({id:++uid, name, email, date, stage, rating, short, phone:'+20 100 '+(1000+uid), notes:[]});\n\nconst JOBS = [\n  {id:1,title:'First Team Analyst',location:'Cairo, EG',posted:'12 Jul 2026',source:'Manual entry',status:'Open',cands:[\n    c('Youssef Mansour','y.mansour@mail.com','14 Jul 2026','Interview',5,true),\n    c('Layla Hassan','layla.h@mail.com','14 Jul 2026','Screening',4,true),\n    c('Omar Deraz','o.deraz@mail.com','15 Jul 2026','Applied',3,false),\n    c('Salma Fathy','salma.fathy@mail.com','16 Jul 2026','Offer',5,true),\n    c('Karim Sabry','k.sabry@mail.com','17 Jul 2026','Applied',2,false),\n    c('Hana Adel','hana.adel@mail.com','18 Jul 2026','Rejected',2,false),\n    c('Tarek Nabil','t.nabil@mail.com','19 Jul 2026','Screening',4,false),\n    c('Nadia Riad','n.riad@mail.com','21 Jul 2026','Interview',4,true)]},\n  {id:2,title:'Padel Operations Manager',location:'New Cairo, EG',posted:'02 Jul 2026',source:'Manual entry',status:'Open',cands:[\n    c('Mostafa Lotfy','m.lotfy@mail.com','04 Jul 2026','Hired',5,true),\n    c('Rana Kamal','rana.k@mail.com','05 Jul 2026','Interview',4,true),\n    c('Ziad Sherif','z.sherif@mail.com','06 Jul 2026','Applied',3,false),\n    c('Aya Mounir','aya.m@mail.com','09 Jul 2026','Screening',3,false)]},\n  {id:3,title:'Academy Goalkeeping Coach',location:'Alexandria, EG',posted:'24 Jun 2026',source:'Manual entry',status:'Open',cands:[\n    c('Peter Gerges','p.gerges@mail.com','26 Jun 2026','Interview',5,true),\n    c('Hossam Elwy','h.elwy@mail.com','27 Jun 2026','Screening',4,false),\n    c('Marwan Fouad','m.fouad@mail.com','28 Jun 2026','Applied',3,false),\n    c('Basma Zaki','b.zaki@mail.com','30 Jun 2026','Rejected',1,false),\n    c('Ali Shawky','ali.s@mail.com','01 Jul 2026','Applied',4,false)]},\n  {id:4,title:'Broadcast Motion Designer',location:'Remote',posted:'18 Jun 2026',source:'Manual entry',status:'Open',cands:[\n    c('Farida Selim','f.selim@mail.com','20 Jun 2026','Offer',5,true),\n    c('Amr Tahoun','a.tahoun@mail.com','21 Jun 2026','Screening',3,false),\n    c('Dina Wagdy','d.wagdy@mail.com','23 Jun 2026','Applied',2,false)]},\n  {id:5,title:'Community Growth Lead',location:'Cairo, EG',posted:'02 Jun 2026',source:'Manual entry',status:'Closed',cands:[\n    c('Mahmoud Ezzat','m.ezzat@mail.com','05 Jun 2026','Hired',5,true),\n    c('Nourhan Adly','n.adly@mail.com','06 Jun 2026','Rejected',2,false)]},\n  {id:6,title:'Match Data Engineer',location:'Cairo, EG (Hybrid)',posted:'28 May 2026',source:'Manual entry',status:'Closed',cands:[\n    c('Sherif Gaber','s.gaber@mail.com','30 May 2026','Hired',4,true),\n    c('Menna Osman','menna.o@mail.com','31 May 2026','Rejected',3,false)]}\n];\nJOBS[0].cands[0].notes = [\n  {who:'Hazem K.',when:'2d ago',text:'Strong Wyscout portfolio. Walked through our xG model without prompting.'},\n  {who:'Sara M.',when:'1d ago',text:'Panel interview booked for Thursday 14:00 with the analysis team.'}];\n\nconst initials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();\nconst stars = r => '★★★★★'.slice(0,r) + '☆☆☆☆☆'.slice(0,5-r);\n\nclass Component extends DCLogic {\n  state = {screen:'overview', jobs:JOBS, jobId:1, candId:null, modal:null, stageF:'All', ratingF:'All', statusF:'All', search:'', form:{}, note:'', toggles:{a:true,b:true,c:false}};\n\n  set(p){ this.setState(p); }\n  job(){ return this.state.jobs.find(j=>j.id===this.state.jobId) || this.state.jobs[0]; }\n  allCands(){ return this.state.jobs.flatMap(j=>j.cands.map(c=>({...c, jobTitle:j.title}))); }\n  mutate(id, patch){\n    this.setState(s=>({jobs:s.jobs.map(j=>({...j, cands:j.cands.map(c=>c.id===id?{...c,...patch}:c)}))}));\n  }\n  avatar(id){ return AVA[id % AVA.length]; }\n  segments(j){\n    const t = j.cands.length || 1;\n    return STAGES.map(st=>({st, n:j.cands.filter(c=>c.stage===st).length}))\n      .filter(x=>x.n>0)\n      .map(x=>({w:(x.n/t*100).toFixed(1)+'%', bg:SEGC[x.st], legend:x.st+' '+x.n}));\n  }\n  chip(active){ return active\n    ? {bg:'#0F52BA', color:'#EFEDDA', border:'#0F52BA'}\n    : {bg:'#FFFFFF', color:'#2C3A5E', border:'#A6C5D7'}; }\n\n  renderVals(){\n    const s = this.state, job = this.job(), all = this.allCands();\n    const openJobs = s.jobs.filter(j=>j.status==='Open');\n    const shortAll = all.filter(c=>c.short);\n    const openJob = id => () => this.set({screen:'job', jobId:id, stageF:'All', ratingF:'All'});\n\n    const nav = [\n      {key:'overview',label:'Overview',icon:'⌂',count:''},\n      {key:'jobs',label:'Jobs',icon:'▤',count:String(s.jobs.length)},\n      {key:'shortlist',label:'Shortlist',icon:'●',count:String(shortAll.length)},\n      {key:'settings',label:'Settings',icon:'◧',count:''}\n    ].map(n=>{\n      const active = s.screen===n.key || (n.key==='jobs' && s.screen==='job');\n      return {...n, bg:active?'#0F52BA':'transparent', color:active?'#EFEDDA':'#DDE6F3', go:()=>this.set({screen:n.key})};\n    });\n\n    const metrics = [\n      {label:'OPEN JOBS', value:openJobs.length, delta:'+2 this month', deltaColor:'#2E8B67'},\n      {label:'TOTAL APPLICANTS', value:all.length, delta:'+9 this week', deltaColor:'#2E8B67'},\n      {label:'SHORTLISTED', value:shortAll.length, delta:'34% of applicants', deltaColor:'#2C3A5E'},\n      {label:'INTERVIEWS SCHEDULED', value:all.filter(c=>c.stage==='Interview').length, delta:'3 in next 5 days', deltaColor:'#D6A13A'}\n    ];\n\n    const accent = this.props.accentColor || '#0F52BA';\n    const mode = this.props.funnelMode || 'reached';\n    const showConv = this.props.showConversion !== false;\n    const FLOW = ['Applied','Screening','Interview','Offer','Hired'];\n    const rejected = all.filter(c=>c.stage==='Rejected').length;\n    const idxOf = c => FLOW.indexOf(c.stage);\n    const counts = FLOW.map((st,i)=> mode==='current'\n      ? all.filter(c=>c.stage===st).length\n      : all.filter(c=>idxOf(c)>=i).length);\n    const fmax = Math.max(...counts, 1);\n    const funnel = FLOW.map((st,i)=>{\n      const n = counts[i], prev = i ? counts[i-1] : 0;\n      const pct = Math.round(n/fmax*100);\n      return {\n        label:st, n, bg: i===FLOW.length-1 ? '#2E8B67' : (i===0 ? '#A6C5D7' : accent),\n        numColor:'#EFEDDA',\n        w: Math.max(pct, 14)+'%',\n        share: all.length ? Math.round(n/all.length*100)+'% of all' : '—',\n        conv: showConv && i ? (prev ? Math.round(n/prev*100)+'%↓' : '—') : '',\n        convColor: showConv && i && prev && n/prev < 0.4 ? '#D6A13A' : '#A6C5D7'\n      };\n    });\n\n    const cardOf = j => ({\n      title:j.title, status:j.status, statusTone:j.status==='Open'?'success':'neutral',\n      location:j.location, source:j.source, meta:'Posted '+j.posted+' · '+j.source+' · '+j.location,\n      count:j.cands.length, short:j.cands.filter(c=>c.short).length,\n      interviews:j.cands.filter(c=>c.stage==='Interview').length,\n      segments:this.segments(j), open:openJob(j.id)\n    });\n\n    const q = s.search.trim().toLowerCase();\n    const visibleJobs = s.jobs.filter(j=>(s.statusF==='All'||j.status===s.statusF) && (!q||j.title.toLowerCase().includes(q)));\n\n    const rowOf = (c, i) => ({\n      ...c, initials:initials(c.name), avatarBg:this.avatar(c.id), stars:stars(c.rating),\n      tone:TONE[c.stage], cv:'CV.pdf ↗', rowBg:(this.props.zebraRows!==false && i%2)?'#F7F9FC':'#FFFFFF',\n      shortLabel:c.short?'Shortlisted':'Shortlist',\n      view:()=>this.set({candId:c.id, jobId:c.jobId?s.jobs.find(j=>j.title===c.jobTitle).id:s.jobId, screen:'job'}),\n      shortlist:()=>this.mutate(c.id,{short:!c.short, stage:c.stage==='Applied'?'Screening':c.stage}),\n      reject:()=>this.mutate(c.id,{stage:'Rejected', short:false})\n    });\n\n    let rows = job.cands\n      .filter(c=>s.stageF==='All'||c.stage===s.stageF)\n      .filter(c=>s.ratingF==='All'||c.rating>=Number(s.ratingF))\n      .filter(c=>!q||c.name.toLowerCase().includes(q));\n    rows = rows.map(rowOf);\n\n    const cand = s.candId ? all.find(c=>c.id===s.candId) : null;\n    const panel = cand ? {\n      ...cand, initials:initials(cand.name), avatarBg:this.avatar(cand.id),\n      notes: cand.notes.length ? cand.notes : [{who:'System',when:'on apply',text:'Added manually by the recruiting team.'}]\n    } : null;\n\n    return {\n      nav, metrics, search:s.search,\n      candTotalLabel: all.length+' CANDIDATES · ADDED MANUALLY',\n      onSearch:e=>this.set({search:e.target.value}),\n      isOverview:s.screen==='overview', isJobs:s.screen==='jobs', isJobDetail:s.screen==='job',\n      isShortlist:s.screen==='shortlist', isSettings:s.screen==='settings',\n      goJobs:()=>this.set({screen:'jobs'}),\n      activeJobs: openJobs.map(j=>({title:j.title, meta:'Posted '+j.posted+' · '+j.location, count:j.cands.length, segments:this.segments(j), open:openJob(j.id)})),\n      funnel, funnelTotalLabel: counts[0]+' ACTIVE / '+all.length+' TOTAL',\n      rejectedLabel: rejected+' · '+(all.length?Math.round(rejected/all.length*100):0)+'%',\n      todos:[\n        {text:'4 new applicants unreviewed — First Team Analyst', when:'today', bg:'#C1443D'},\n        {text:'Offer pending response — Salma Fathy', when:'2d', bg:'#D6A13A'},\n        {text:'Panel interview to confirm — Peter Gerges', when:'Thu', bg:'#0F52BA'},\n        {text:'Close job post: Community Growth Lead', when:'overdue', bg:'#C1443D'}\n      ],\n      jobCards: visibleJobs.map(cardOf),\n      jobsSubtitle: visibleJobs.length+' job posts · '+all.length+' applicants total',\n      statusChips: ['All','Open','Closed'].map(l=>({label:l, ...this.chip(s.statusF===l), go:()=>this.set({statusF:l})})),\n      job: {...cardOf(job), stats:[\n        {k:'APPLICANTS', v:job.cands.length},\n        {k:'SHORTLISTED', v:job.cands.filter(c=>c.short).length},\n        {k:'IN INTERVIEW', v:job.cands.filter(c=>c.stage==='Interview').length}\n      ]},\n      stageChips: ['All',...STAGES].map(l=>({label:l, ...this.chip(s.stageF===l), go:()=>this.set({stageF:l})})),\n      ratingChips: ['All','5','4','3'].map(l=>({label:l==='All'?'Any rating':l+'★ +', ...this.chip(s.ratingF===l), go:()=>this.set({ratingF:l})})),\n      rows, noRows:rows.length===0,\n      rowsLabel: rows.length+' of '+job.cands.length+' candidates',\n      shortRows: shortAll.map(rowOf),\n      panel, cvLines:['96%','88%','72%','92%','64%','84%','56%','78%'].map(w=>({w})),\n      panelStars: [1,2,3,4,5].map(n=>({color: cand && cand.rating>=n ? '#D6A13A' : '#DDE6F3', set:()=>this.mutate(s.candId,{rating:n})})),\n      stageOptions: STAGES, sourceOptions:['Manual entry','Referral','Direct application','Agency','Scouting network'],\n      statusOptions:['Open','Closed'], pipelineOptions:['Applied → Screening → Interview → Offer → Hired','Applied → Interview → Offer'],\n      onPanelStage: e=>this.mutate(s.candId,{stage:e.target.value}),\n      closePanel:()=>this.set({candId:null}),\n      panelNext:()=>{ const i=STAGES.indexOf(cand.stage); this.mutate(s.candId,{stage:STAGES[Math.min(i+1,4)]}); },\n      panelShortlist:()=>this.mutate(s.candId,{short:true}),\n      panelReject:()=>{ this.mutate(s.candId,{stage:'Rejected',short:false}); this.set({candId:null}); },\n      noteDraft:s.note, onNoteDraft:e=>this.set({note:e.target.value}),\n      addNote:()=>{ if(!s.note.trim())return; const list=(cand.notes||[]).concat([{who:'Hazem K.',when:'just now',text:s.note}]); this.mutate(s.candId,{notes:list}); this.set({note:''}); },\n      jobModal:s.modal==='job', candModal:s.modal==='cand',\n      openJobModal:()=>this.set({modal:'job', form:{source:'Manual entry', status:'Open'}}),\n      openCandModal:()=>this.set({modal:'cand', form:{source:'Manual entry', stage:'Applied', rating:3}}),\n      closeModals:()=>this.set({modal:null}),\n      form:s.form,\n      onForm: ['title','location','source','status','name','email','stage'].reduce((a,k)=>{\n        a[k]=e=>this.setState(st=>({form:{...st.form,[k]:e.target.value}})); return a;}, {}),\n      formStars: [1,2,3,4,5].map(n=>({color:(s.form.rating||0)>=n?'#D6A13A':'#DDE6F3', set:()=>this.setState(st=>({form:{...st.form,rating:n}}))})),\n      submitJob:()=>{ const f=s.form; if(!f.title){this.set({modal:null});return;}\n        const j={id:++uid, title:f.title, location:f.location||'Cairo, EG', posted:'05 Aug 2026', source:f.source||'Manual entry', status:f.status||'Open', cands:[]};\n        this.setState(st=>({jobs:[j,...st.jobs], modal:null, screen:'job', jobId:j.id, form:{}})); },\n      submitCand:()=>{ const f=s.form; if(!f.name){this.set({modal:null});return;}\n        const nc=c(f.name, f.email||'candidate@mail.com','05 Aug 2026', f.stage||'Applied', f.rating||3, false);\n        this.setState(st=>({jobs:st.jobs.map(j=>j.id===st.jobId?{...j,cands:[nc,...j.cands]}:j), modal:null, form:{}})); },\n      toggles:[\n        {label:'Require email on new candidates', hint:'Blocks saving a candidate without a contact email', on:s.toggles.a, toggle:()=>this.setState(st=>({toggles:{...st.toggles,a:!st.toggles.a}}))},\n        {label:'Email me on new shortlist adds', hint:'Digest at 09:00 daily', on:s.toggles.b, toggle:()=>this.setState(st=>({toggles:{...st.toggles,b:!st.toggles.b}}))},\n        {label:'Require CV before interview stage', hint:'Blocks stage change without an attached CV', on:s.toggles.c, toggle:()=>this.setState(st=>({toggles:{...st.toggles,c:!st.toggles.c}}))}\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
